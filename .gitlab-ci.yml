# MeshSat firmware: build both node envs on every push to main, on tags and on merge requests.
# PlatformIO Core 6.1.19 is required: the meshtastic pioarduino platform pins SCons 4.8.1, and
# Core 6.2 pins SCons 4.11, which breaks the nested Arduino build (MESHSAT-1233).
# The build is hybrid ESP-IDF; a cold run downloads about 1 GB of toolchain and takes ~15 min
# per env, an incremental run with a warm cache a few minutes. MeshSat sources must build
# with zero warnings; upstream's own warnings are not our concern here.

stages:
  - build

variables:
  PLATFORMIO_CORE_DIR: "$CI_PROJECT_DIR/.platformio"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  GIT_DEPTH: 50

.firmware:
  stage: build
  image: python:3.12-slim
  tags: [multiarch]
  cache:
    key: "pio-$ENV"
    paths:
      - .platformio/
      - .pip-cache/
      - .pio/libdeps/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install -q "platformio==6.1.19"
  script:
    - pio run -e "$ENV" 2>&1 | tee build.log
    - |
      if grep -E "src/meshsat/.*(warning|error)" build.log; then
        echo "MeshSat sources must build with zero warnings"; exit 1
      fi
    - cd ".pio/build/$ENV" && sha256sum firmware-*.bin littlefs-*.bin > SHA256SUMS && cat SHA256SUMS
  artifacts:
    name: "$ENV-$CI_COMMIT_SHORT_SHA"
    paths:
      - .pio/build/$ENV/firmware-*.bin
      - .pio/build/$ENV/littlefs-*.bin
      - .pio/build/$ENV/SHA256SUMS
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:tbeam-s3-rockblock:
  extends: .firmware
  variables:
    ENV: meshsat-tbeam-s3-rockblock

build:xiao-s3-rockblock:
  extends: .firmware
  variables:
    ENV: meshsat-xiao-s3-rockblock
