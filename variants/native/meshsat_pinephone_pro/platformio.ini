; MeshSat: meshtasticd for a PinePhone or PinePhone Pro wearing Pine64's LoRa back cover
; (SX1262 behind an ATtiny84 I2C-to-SPI bridge on the pogo pins). Everything [env:native]
; is, plus the bridge as a radio bus: `Lora: spidev: pinedio-i2c` in config.yaml.
; Build on the phone or for aarch64: pio run -e meshsat-pinephone-pro
[env:meshsat-pinephone-pro]
extends = env:native
build_flags = ${env:native.build_flags}
  -D MESHSAT_PINEDIO_BRIDGE=1
  ; Every byte costs 3.5 ms on this bridge. RadioLib's status request after each write is two.
  -D RADIOLIB_SPI_PARANOID=0
lib_deps =
  ${native_base.lib_deps}
  https://github.com/meshsat/meshsat-lora-backplate.git#0278bc9

; The same, unable to transmit: the firmware switches its transmitter off at every boot,
; whatever the stored configuration says. For a bench where the antenna is not confirmed.
[env:meshsat-pinephone-pro-rxonly]
extends = env:meshsat-pinephone-pro
build_flags = ${env:meshsat-pinephone-pro.build_flags}
  -D USERPREFS_LORA_TX_DISABLED=1
