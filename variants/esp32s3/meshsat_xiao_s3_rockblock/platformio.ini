; MeshSat node: Seeed XIAO ESP32-S3 + Wio-SX1262 (B2B) + RockBLOCK 9603 on the
; XIAO header pins D6/D7. Based on seeed_xiao_s3; the L76K GPS that variant puts
; on GPIO43/44 is compiled out because the RockBLOCK uses those pins.
; Hardware model stays SEEED_XIAO_S3 so Meshtastic clients recognise the board.
[env:meshsat-xiao-s3-rockblock]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = MeshSat XIAO ESP32-S3 + RockBLOCK 9603
custom_meshtastic_images = seeed-xiao-s3.svg
custom_meshtastic_tags = MeshSat
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = extra
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -D MESHSAT_IRIDIUM=1
  -D MESHSAT_BLE_WATCHDOG_IDLE_HOURS=6
  -D MESHTASTIC_EXCLUDE_GPS=1
  -I variants/esp32s3/meshsat_xiao_s3_rockblock
  -DBOARD_HAS_PSRAM
