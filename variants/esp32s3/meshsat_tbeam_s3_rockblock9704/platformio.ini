; MeshSat node v2: LILYGO T-Beam Supreme + RockBLOCK 9704 (Iridium IMT) on header PM1.
; The 9704 speaks JSPR at 230400 baud and takes DCDC5 on V_BATT; the node's own 9603 routing is left out.
[env:meshsat-tbeam-s3-rockblock9704]
extends = env:tbeam-s3-core
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = MeshSat T-Beam Supreme + RockBLOCK 9704
custom_meshtastic_tags = MeshSat
board_level = extra
upload_protocol = esptool
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_BT_NIMBLE_MAX_CCCDS=42
build_flags =
  ${esp32s3_base.build_flags}
  -D MESHSAT_IRIDIUM=1
  -D MESHSAT_IRIDIUM_JSPR=1
  -D MESHSAT_STATUS_V2=1
  -D MESHTASTIC_EXCLUDE_SERIAL=1
  -I variants/esp32s3/meshsat_tbeam_s3_rockblock9704
  -I variants/esp32s3/tbeam-s3-core
