; MeshSat node v1: LILYGO T-Beam Supreme + RockBLOCK 9603 on header PM1.
; The upstream tbeam-s3-core board with the Iridium serial pipe; the modem is
; powered from the AXP2101 DCDC5 rail. The serial module is compiled out because
; the modem uses UART2 and GPIO43/44 are the only free header pins.
[env:meshsat-tbeam-s3-rockblock]
extends = env:tbeam-s3-core
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = MeshSat T-Beam Supreme + RockBLOCK 9603
custom_meshtastic_tags = MeshSat
board_level = extra
upload_protocol = esptool
build_flags =
  ${esp32s3_base.build_flags}
  -D MESHSAT_IRIDIUM=1
  -D MESHTASTIC_EXCLUDE_SERIAL=1
  -I variants/esp32s3/meshsat_tbeam_s3_rockblock
  -I variants/esp32s3/tbeam-s3-core
